<svg width="980" height="620" viewBox="0 0 980 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MacBook unlock illustration">
  <defs>
    <linearGradient id="screenGlow" x1="490" y1="80" x2="490" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a1a1c"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="faceRing" x1="490" y1="200" x2="490" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2997ff"/>
      <stop offset="1" stop-color="#0071e3"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- MacBook body -->
  <g filter="url(#softShadow)">
    <rect x="120" y="70" width="740" height="460" rx="18" fill="#2c2c2e"/>
    <rect x="136" y="86" width="708" height="420" rx="10" fill="url(#screenGlow)"/>

    <!-- Notch -->
    <rect x="430" y="86" width="120" height="18" rx="0 0 10 10" fill="#0a0a0b"/>

    <!-- Face unlock UI -->
    <circle cx="490" cy="280" r="72" stroke="url(#faceRing)" stroke-width="2.5" fill="none" opacity="0.9"/>
    <circle cx="490" cy="280" r="58" stroke="#2997ff" stroke-width="1" fill="none" opacity="0.35"/>

    <!-- Simplified face -->
    <ellipse cx="490" cy="278" rx="28" ry="34" stroke="#f5f5f7" stroke-width="2" fill="none" opacity="0.85"/>
    <circle cx="478" cy="270" r="3" fill="#f5f5f7" opacity="0.9"/>
    <circle cx="502" cy="270" r="3" fill="#f5f5f7" opacity="0.9"/>
    <path d="M478 294c6 8 18 8 24 0" stroke="#f5f5f7" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85"/>

    <text x="490" y="390" text-anchor="middle" fill="#f5f5f7" font-family="SF Pro Text, -apple-system, system-ui, sans-serif" font-size="15" opacity="0.7">Looking for you…</text>
  </g>

  <!-- Base -->
  <path d="M90 530h800c8 0 14 6 14 14v8H76v-8c0-8 6-14 14-14z" fill="#c7c7cc"/>
  <rect x="76" y="552" width="828" height="10" rx="2" fill="#aeaeb2"/>
</svg>
